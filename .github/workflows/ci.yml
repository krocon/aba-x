# CI after the model of Files and Folders: frontend checks once for all packages and apps, Rust on
# all three desktop platforms for every app (the #[cfg(target_os)] code is otherwise never compiled
# on Windows/macOS/Linux). Apps: scripts/apps.mjs – a new app gets a `matrix.app` entry and its
# own frontend steps (`pnpm --filter <app> build`, `build:web`, `test`).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    # root scripts build and test ABA-X1 (+ all packages); a second app adds its own build/test steps here
    name: Frontend (format, lint, packages + ABA-X1 test, desktop + web build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm scripts:test
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:web

  rust:
    name: Rust ${{ matrix.app }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        app: [aba-x1]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/${{ matrix.app }}/src-tauri
      - run: cargo fmt --manifest-path apps/${{ matrix.app }}/src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/${{ matrix.app }}/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path apps/${{ matrix.app }}/src-tauri/Cargo.toml --locked
