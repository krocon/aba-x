# Release workflow (prompt 022, adopted from Files and Folders design 017). Builds installable packages for
# macOS (universal .dmg/.app), Windows (.msi + NSIS .exe) and Linux (.deb, .rpm, .AppImage)
# with tauri-apps/tauri-action and attaches them to a DRAFT GitHub release.
#
# One app per run (monorepo, prompt 024): the tag names it – `aba-x1-v0.2.0` builds ABA-X1 0.2.0
# (scripts/apps.mjs; the tags v0.1.0/v0.1.1 from before the monorepo are not rebuilt).
# Triggers: manually (Actions → Release → Run workflow, choose the app) or by pushing a tag `<app>-v*`.
# Nothing is published automatically: the release stays a draft until Marc publishes it.
#
# Signing is optional. Without the secrets below the packages are built unsigned
# (macOS: Gatekeeper warning, Windows: SmartScreen warning) – see docs/release.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to build (scripts/apps.mjs)'
        type: choice
        options: [aba-x1]
        default: aba-x1
      draft:
        description: 'Create the GitHub release as a draft'
        type: boolean
        default: true
  push:
    tags: ['*-v*']

permissions:
  contents: write # create the (draft) release and upload assets

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.v.outputs.app }}
      version: ${{ steps.v.outputs.version }}
      title: ${{ steps.v.outputs.title }}
    steps:
      - uses: actions/checkout@v5
      - name: App and version (from the tag or the input); versions agree
        id: v
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          APP_INPUT: ${{ inputs.app || 'aba-x1' }}
        run: |
          out=$(node scripts/apps.mjs release "$TAG" "$APP_INPUT")
          echo "$out" | tee -a "$GITHUB_OUTPUT"
          node scripts/version.mjs check --app "$(echo "$out" | sed -n 's/^app=//p')"

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          # Oldest supported Ubuntu runner → AppImage/deb work on older glibc as well
          - platform: ubuntu-22.04
            args: ''
            rust_targets: ''
          - platform: windows-latest
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.platform }}
    env:
      # secrets cannot be used in `if:` directly
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      APP_DIR: apps/${{ needs.check.outputs.app }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev rpm

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/${{ needs.check.outputs.app }}/src-tauri
      - run: pnpm install --frozen-lockfile
      # THIRD-PARTY-NOTICES.txt goes into every package (tauri.conf.json `bundle.resources`):
      # refuse to ship it out of date (`pnpm notices` regenerates it)
      - run: pnpm notices:check --app ${{ needs.check.outputs.app }}

      # --- Windows code signing (optional) ------------------------------------------
      # Imports a .pfx (base64 in WINDOWS_CERTIFICATE) into the user store and tells
      # Tauri its thumbprint. Skipped when the secret is missing → unsigned installer.
      - name: Import Windows certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, $bytes)
          $pw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          $confPath = "$env:APP_DIR/src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $conf.bundle.windows.certificateThumbprint = $cert.Thumbprint
          $conf | ConvertTo-Json -Depth 32 | Set-Content $confPath -Encoding utf8

      # --- macOS signing + notarisation (optional) ------------------------------------
      # Only non-empty secrets are exported: an empty APPLE_CERTIFICATE would make the
      # bundler try (and fail) to import a certificate. No secrets → unsigned .dmg/.app.
      - name: macOS signing secrets
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Notarisation via App Store Connect API key (preferred, docs/macos-signing.md):
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY; do
            if [ -n "${!name}" ]; then echo "$name=${!name}" >> "$GITHUB_ENV"; fi
          done
          # The bundler wants a file path for the .p8 key; write it to the runner's temp dir.
          if [ -n "$APPLE_API_PRIVATE_KEY" ]; then
            key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key"
            chmod 600 "$key"
            echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- updater signature (only once the updater is enabled, docs/release.md) -
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ${{ env.APP_DIR }}
          tauriScript: pnpm tauri
          tagName: ${{ needs.check.outputs.app }}-v__VERSION__
          releaseName: ${{ needs.check.outputs.title }} v__VERSION__
          releaseBody: "Unsigned preview build unless noted. Release notes: generate with `pnpm release:notes` (docs/release.md) and paste here before publishing."
          releaseDraft: ${{ github.event_name != 'workflow_dispatch' || inputs.draft }}
          prerelease: ${{ startsWith(needs.check.outputs.version, '0.') }}
          args: ${{ matrix.args }}

  web:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ${{ needs.check.outputs.app }} build:web
      # the static web version as a workflow artifact (deployment: docs/deployment.md, prompt 020)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.check.outputs.app }}-web-${{ needs.check.outputs.version }}
          path: dist/${{ needs.check.outputs.app }}/web/browser
