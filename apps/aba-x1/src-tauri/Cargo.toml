[package]
name = "aba-x"
version = "1.0.0"
description = "ABA-X1 – scientific & symbolic calculator (Tauri 2 + Angular)"
authors = ["krocon"]
license = "MIT"
repository = "https://github.com/krocon/aba-x"
edition = "2024"
rust-version = "1.90"

[lib]
name = "abax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# storage, export files, native menu, about, dialogs, window state: shared with every app (prompt 025)
aba-shell = { path = "../../../crates/shell" }
tauri = { version = "2.12.5", features = [] }
# direct dependency so tauri-build knows its permissions (capabilities: dialog:allow-save/open)
tauri-plugin-dialog = "2.8"
