<main class="content">
  <h1 class="visually-hidden">ABA-X1 – Scientific &amp; Symbolic Calculator</h1>
  <app-calculator-device />
</main>

<footer class="status" aria-live="polite">
  <span>{{ kind === 'desktop' ? 'Desktop' : 'Web' }}</span>
  @if (info(); as i) {
    <span>v{{ i.version }}</span>
    @if (i.os !== 'web') {
      <span>{{ i.os }} · {{ i.arch }}</span>
    }
  }
  @if (ui.storageProblem(); as problem) {
    <span class="problem">{{ problem }}</span>
  }
</footer>
