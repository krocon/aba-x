[package]
name = "aba-x"
version = "0.1.0"
description = "ABA-X1 – scientific & symbolic calculator (Tauri 2 + Angular)"
authors = ["krocon"]
license = "MIT"
repository = "https://github.com/krocon/aba-x"
edition = "2024"
rust-version = "1.90"

[lib]
name = "abax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.5", features = [] }
# design 002: native save/open dialogs; window size/position remembered between starts
tauri-plugin-dialog = "2.8"
tauri-plugin-window-state = "2.5"

[dev-dependencies]
tempfile = "3"
