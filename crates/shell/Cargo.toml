[package]
name = "aba-shell"
version = "0.1.0"
description = "Shared Tauri desktop shell of the ABA calculators: storage, export files, native menu, about"
authors = ["krocon"]
license = "MIT"
repository = "https://github.com/krocon/aba-x"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "aba_shell"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-window-state = "2.5"

[dev-dependencies]
tempfile = "3"
